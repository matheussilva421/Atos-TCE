<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATOS TCE · Mesa Local</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">ATOS TCE</span>
        <span class="brand-sub">Mesa Local</span>
      </div>
      <div id="health-status" class="chips" role="status" aria-live="polite">
        <span class="chip chip-busy">conectando…</span>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="summary-title">
        <h2 id="summary-title">Resumo</h2>
        <p id="summary" class="summary-line">Carregando…</p>
        <dl id="storage-summary" class="storage-grid"></dl>
      </section>

      <section class="panel" aria-labelledby="area-title">
        <h2 id="area-title">Área Restrita</h2>
        <div class="area-actions">
          <button id="analyze-area" type="button">Analisar Área Restrita</button>
          <button id="analyze-area-cdp" class="ghost" type="button">Modo de compatibilidade</button>
          <span id="analyze-status" class="muted">Ainda não analisada nesta sessão.</span>
        </div>
        <dl id="area-counters" class="storage-grid"></dl>
        <div class="area-actions acquisition">
          <button id="download-pending" type="button">Baixar processos pendentes</button>
          <button id="resume-acquisition" class="ghost" type="button" hidden>
            Retomar após login
          </button>
          <span id="acquisition-status" class="muted"></span>
        </div>
        <p id="acquisition-progress" class="muted"></p>
        <ul id="acquisition-failures" class="failures"></ul>
        <div id="pairing" class="pairing">
          <p class="muted">
            <span id="pairing-state">Verificando a extensão…</span>
            <strong id="pairing-code" class="mono" hidden></strong>
          </p>
          <button id="renew-pairing" class="ghost" type="button" hidden>Renovar código</button>
          <button id="reset-pairing" class="ghost" type="button" hidden>Reparear extensão</button>
        </div>
      </section>

      <div class="columns">
        <section class="panel" aria-labelledby="process-list-title">
          <h2 id="process-list-title">Processos</h2>
          <div class="toolbar">
            <label class="field">
              <span>Buscar</span>
              <input
                id="process-search"
                type="search"
                placeholder="processo ou interessado"
                autocomplete="off"
              />
            </label>
            <label class="field">
              <span>Situação</span>
              <select id="process-status-filter">
                <option value="">todas</option>
                <option>PENDENTE</option>
                <option>IDENTIFICADO</option>
                <option>BAIXANDO</option>
                <option>BAIXADO</option>
                <option>ANALISANDO</option>
                <option>REVISAR</option>
                <option>PRONTO</option>
                <option>PREENCHIDO</option>
                <option>CONCLUÍDO</option>
                <option>ERRO</option>
                <option>BLOQUEADO</option>
                <option>DIVERGENCIA</option>
              </select>
            </label>
          </div>
          <p id="process-count" class="muted"></p>
          <ul id="process-list" class="process-list"></ul>
          <p id="process-list-empty" class="empty" hidden>Nenhum processo encontrado.</p>
        </section>

        <section class="panel" aria-labelledby="process-detail-title">
          <h2 id="process-detail-title">Detalhe do processo</h2>
          <div id="detail-tabs" class="tabs" role="tablist" aria-label="Seções do processo">
            <button type="button" role="tab" data-tab="dados" aria-selected="true">Dados</button>
            <button type="button" role="tab" data-tab="documentos" aria-selected="false">Documentos</button>
            <button type="button" role="tab" data-tab="historico" aria-selected="false">Histórico</button>
          </div>
          <div id="process-detail" class="detail">
            <p class="empty">Selecione um processo na lista.</p>
          </div>
          <section id="pdf-viewer" class="viewer" hidden aria-label="Visualizador de PDF">
            <div class="viewer-toolbar">
              <button id="viewer-zoom-out" type="button" title="Reduzir zoom">−</button>
              <span id="viewer-zoom-label" class="muted">150%</span>
              <button id="viewer-zoom-in" type="button" title="Aumentar zoom">+</button>
              <button id="viewer-rotate" type="button">Girar 90°</button>
              <button id="viewer-reset" type="button">Reiniciar</button>
              <span class="viewer-spacer"></span>
              <button id="viewer-prev" type="button">Página anterior</button>
              <span id="viewer-page-label" class="muted"></span>
              <button id="viewer-next" type="button">Próxima página</button>
              <button id="viewer-close" type="button">Fechar</button>
            </div>
            <div class="viewer-stage">
              <canvas id="viewer-canvas"></canvas>
              <div id="viewer-overlay" class="viewer-overlay"></div>
            </div>
            <p id="viewer-caption" class="muted"></p>
          </section>
        </section>
      </div>
    </main>

    <footer class="footer">
      <span id="footer-note" class="muted"></span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
